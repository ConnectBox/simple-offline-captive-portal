<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 3.2//EN">
<HTML lang="{{ lang }}" dir="{{ text_dir }}">
<HEAD>
    <META http-equiv="Content-Type" content="text/html; charset=utf-8">
    <TITLE>{{ title }}</TITLE>
</HEAD>
<BODY>
{% if link_type == "href" %}
<a href='{{ connectbox_url }}'>{{ go_to_link }}</a>
{% else %}
<strong>{{ go_to_text }}</strong>
{% endif %}
<p>
<img src="{{ browser_icon }}" alt="{{ type_address }}"/>
</p>
{% if show_ok %}
<form action="" method="POST"><button style="width: 120px; height: 45px">{{ ok_label }}</button></form>
{% endif %}
{% if show_use_as_is %}
<p style="font-size: 1.5em">{{ not_closing }}</p>
{% endif %}
</BODY>
</HTML>
